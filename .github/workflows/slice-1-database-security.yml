name: TEN29 database verification

on:
  push:
    branches:
      - feature/slice-1-admin-authorization
      - feature/slice-2-reservation-domain
      - feature/slice-3-atomic-confirmation
      - feature/slice-4-dynamic-pricing
      - feature/slice-5-guest-booking-calendar
      - feature/slice-6-owner-media-management
      - feature/slice-7-owner-booking-operations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-1-database-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: Migrations and pgTAP database checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start disposable local Supabase stack
        run: supabase start > /dev/null

      - name: Replay repository migrations on local database
        run: supabase db reset --local --no-seed

      - name: Run database security and booking-domain assertions
        run: supabase test db --local supabase/tests

      - name: Prove concurrent confirmation and owner-block exclusion
        if: hashFiles('supabase/tests/confirmation_concurrency.py') != ''
        run: python3 supabase/tests/confirmation_concurrency.py

      - name: Provision disposable provider UI fixtures
        if: hashFiles('supabase/tests/provider_ui_fixture.py') != ''
        run: python3 supabase/tests/provider_ui_fixture.py
      - uses: actions/setup-node@v4
        if: hashFiles('supabase/tests/provider_ui_fixture.py') != ''
        with:
          node-version: 22
          cache: npm
      - name: Install disposable media probe and synthetic HEIC encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libheif-plugin-libde265 libheif-plugin-x265 libheif-examples
      - name: Verify pricing, guest intake and media against real Supabase
        if: hashFiles('supabase/tests/provider_ui_fixture.py') != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build -- --webpack
          npx playwright test tests/e2e/rates-owner.spec.ts tests/e2e/guest-booking.spec.ts tests/e2e/media-owner.spec.ts tests/e2e/booking-owner.spec.ts --workers=1
      - name: Preserve synthetic owner UI verification artifacts
        if: always() && hashFiles('supabase/tests/provider_ui_fixture.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: owner-pricing-ui-evidence
          path: |
            test-results/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore

  application:
    name: Application regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --maxWorkers=1 --pool=threads
      - run: npx playwright install --with-deps chromium
      # Retain the verified supported production Webpack build for this pipeline.
      - run: npm run build -- --webpack
      - run: npx playwright test --workers=1

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - staging.env
    environment:
      NODE_ENV: production
      TEN29_ENVIRONMENT: staging
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "const authorization='Basic '+Buffer.from(process.env.TEN29_STAGING_ACCESS_USER+':'+process.env.TEN29_STAGING_ACCESS_PASSWORD).toString('base64');fetch('http://127.0.0.1:3000/api/health',{headers:{authorization}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
